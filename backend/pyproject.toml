[project]
name = "claude-lens"
version = "0.1.0"
description = "Usage, cost & workflow analytics for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic>=2.14.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claude-lens = "claude_lens.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
